[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --port 6379 --dir /var/lib/redis --appendonly yes --appendfsync everysec
autostart=true
autorestart=true
priority=5
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:admin-api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8057 --log-level %(ENV_LOG_LEVEL)s
directory=/app/admin-api
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/admin-models",DB_HOST="postgres",DB_PORT="5432",DB_NAME="vexa",DB_USER="vexa",DB_PASSWORD="vexa-secure-password-change-this",DB_SSL_MODE="disable",ADMIN_API_TOKEN="%(ENV_ADMIN_API_TOKEN)s"

[program:runtime-api]
command=uvicorn runtime_api.main:app --host 0.0.0.0 --port 8090 --log-level %(ENV_LOG_LEVEL)s
directory=/app/runtime-api
autostart=true
autorestart=true
priority=25
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",ORCHESTRATOR_BACKEND="docker",DOCKER_HOST="unix:///var/run/docker.sock",DOCKER_NETWORK="vexa-network",REDIS_URL="%(ENV_REDIS_URL)s",BROWSER_IMAGE="vexaai/vexa-bot:latest",PROFILES_PATH="/app/runtime-api/profiles.yaml",API_KEYS="ashera-runtime-key",TRANSCRIPTION_SERVICE_URL="http://assemblyai-proxy:8070/v1/audio/transcriptions",TRANSCRIPTION_SERVICE_TOKEN="placeholder",TTS_SERVICE_URL="",ALLOW_PRIVATE_CALLBACKS="true",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[program:meeting-api]
command=uvicorn meeting_api.main:app --host 0.0.0.0 --port 8080 --log-level %(ENV_LOG_LEVEL)s
directory=/app/meeting-api
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_URL="%(ENV_REDIS_URL)s",RUNTIME_API_URL="http://localhost:8090",RUNTIME_API_TOKEN="ashera-runtime-key",MEETING_API_URL="http://localhost:8080",DB_HOST="postgres",DB_PORT="5432",DB_NAME="vexa",DB_USER="vexa",DB_PASSWORD="vexa-secure-password-change-this",DB_SSL_MODE="disable",BOT_IMAGE_NAME="vexaai/vexa-bot:latest",TRANSCRIPTION_COLLECTOR_URL="http://localhost:8080",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[program:api-gateway]
command=uvicorn main:app --host 0.0.0.0 --port 8056 --log-level %(ENV_LOG_LEVEL)s
directory=/app/api-gateway
autostart=true
autorestart=true
priority=40
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",ADMIN_API_URL="http://localhost:8057",MEETING_API_URL="http://localhost:8080",TRANSCRIPTION_COLLECTOR_URL="http://localhost:8080",MCP_URL="http://localhost:18888",RUNTIME_API_URL="http://localhost:8090",AGENT_API_URL="http://localhost:8100",ADMIN_API_TOKEN="%(ENV_ADMIN_API_TOKEN)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[program:mcp]
command=uvicorn main:app --host 0.0.0.0 --port 18888 --log-level %(ENV_LOG_LEVEL)s
directory=/app/mcp
autostart=true
autorestart=true
priority=50
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",API_GATEWAY_URL="http://localhost:8056",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[group:vexa-core]
programs=redis,xvfb,admin-api,runtime-api,meeting-api,api-gateway,mcp
priority=999
